name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: lint, type-check, build, contract error tables
    runs-on: ubuntu-latest
    env:
      # Public value only; the build needs a base URL to embed.
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      # Compares lib/stellar/errors.ts with the contracts' errors.rs. The
      # contracts repository is not checked out here, so the script prints a
      # notice and exits 0. To enforce it, check out RubbiLabs/RL-smart-contracts
      # next to this repository (actions/checkout with `repository` and `path`)
      # and pass that path: `node scripts/check-contract-errors.mjs <path>`.
      - name: Contract error tables (skips without the contracts repo)
        run: npm run check:errors
